<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>


    <title>Singh Cafe - SKU Generator</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Singh Cafe</h1>

    <nav>
        <a href="index.html">Receipt Generator</a>
        <a href="sku.html">SKU Generator</a>
    </nav>

    <h2>SKU Generator</h2>

    <label>
        Product Category:

        <select id="category">
            <option value="COF">Coffee</option>
            <option value="LAT">Latte</option>
            <option value="DES">Dessert</option>
        </select>
    </label>

    <label>
        Product Name:

        <select id="product-name">
            <option value="AMER">Americano</option>
            <option value="SPAN">Spanish Latte</option>
            <option value="COLD">Cold Brew Malt</option>
            <option value="AFFO">Affogato</option>
            <option value="CARA">Caramel Macchiato</option>
        </select>
    </label>

    <label>
        Stock Quantity:

        <input type="number" id="quantity">
    </label>

    <button py-click="generate_sku">
        Generate SKU
    </button>

    <div id="sku-result">

        <h2>Generated SKU:</h2>

        <p id="sku">---</p>

    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
