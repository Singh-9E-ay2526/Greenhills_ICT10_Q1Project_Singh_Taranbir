<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Singh Cafe</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Singh Cafe</h1>

    <nav>
        <a href="index.html">Receipt Generator</a>
        <a href="sku.html">SKU Generator</a>
    </nav>

    <h2>Receipt Generator</h2>

    <h3>Menu:</h3>

    <label>
        <input type="checkbox" id="americano" value="120">
        Americano - ₱120
    </label>

    <label>
        <input type="checkbox" id="spanish-latte" value="140">
        Spanish Latte - ₱140
    </label>

    <label>
        <input type="checkbox" id="cold-brew" value="150">
        Cold Brew Malt - ₱150
    </label>

    <label>
        <input type="checkbox" id="affogato" value="160">
        Affogato - ₱160
    </label>

    <label>
        <input type="checkbox" id="caramel-macchiato" value="170">
        Caramel Macchiato - ₱170
    </label>

    <button py-click="create_order">
        Create Order
    </button>

    <div id="receipt">

        <h2>Receipt:</h2>

        <p>Subtotal: ₱<span id="subtotal">0</span></p>

        <p>VAT: ₱<span id="vat">0</span></p>

        <p>Total Amount: ₱<span id="total">0</span></p>

    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
